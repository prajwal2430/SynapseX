[project]
name = "synapsex-ai-service"
version = "1.0.0"
description = "SynapseX Advanced AI Evidence Intelligence & LangGraph Microservice"
authors = [{ name = "SynapseX Engineering Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "langgraph>=0.2.20",
    "langchain-core>=0.3.0",
    "neo4j>=5.20.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "redis>=5.0.0",
    "httpx>=0.27.0"
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100
